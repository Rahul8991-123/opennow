<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download App</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:390px;
background:#fff;
border-radius:28px;
padding:30px 22px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,.12);
}

.logo{
width:95px;
height:95px;
background:#1565ff;
border-radius:24px;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:24px;
font-weight:bold;
color:#fff;
margin-bottom:22px;
}

h1{
font-size:22px;
color:#0b3b8f;
margin-bottom:10px;
}

p{
font-size:16px;
color:#666;
line-height:1.5;
margin-bottom:25px;
}

.btn{
width:100%;
height:58px;
border:none;
border-radius:18px;
background:#1565ff;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.btn:active{
transform:scale(.98);
}

.wait{
display:none;
margin-top:18px;
font-size:16px;
font-weight:600;
color:#0b3b8f;
align-items:center;
justify-content:center;
gap:10px;
}

.spin{
width:22px;
height:22px;
border:3px solid #ddd;
border-top:3px solid #1565ff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.note{
margin-top:20px;
background:#f3f4f6;
padding:15px;
border-radius:14px;
font-size:14px;
color:#666;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
APP
</div>

<h1>Download App</h1>

<p>
Tap the button below to download the app.
</p>

<button class="btn" onclick="downloadApp()">
⬇ Download App
</button>

<div class="wait" id="wait">
<div class="spin"></div>
Please wait, download starting...
</div>

<div class="note">
Secure app download page.
</div>

</div>

<script>
function downloadApp(){

document.getElementById("wait").style.display="flex";

setTimeout(function(){

window.open(
"https://github.com/Rahul8991-123/opennow/releases/download/V1/signed.apk",
"_blank"
);

},700);
}
</script>

</body>
</html>
