<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef3f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.box{
width:100%;
max-width:390px;
background:#fff;
padding:30px 22px;
border-radius:28px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.12);
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:24px;
background:#0b5ed7;
display:flex;
justify-content:center;
align-items:center;
font-size:38px;
font-weight:800;
color:#fff;
margin-bottom:18px;
}

h1{
font-size:34px;
color:#0b3b8f;
margin-bottom:10px;
font-weight:800;
}

p{
font-size:15px;
color:#666;
line-height:1.6;
margin-bottom:25px;
}

.download-btn{
width:100%;
height:60px;
border:none;
border-radius:18px;
background:#1565d8;
color:#fff;
font-size:26px;
font-weight:800;
cursor:pointer;
transition:0.3s;
box-shadow:0 8px 22px rgba(21,101,216,0.35);
}

.download-btn:active{
transform:scale(.97);
}

.wait{
display:none;
margin-top:18px;
font-size:16px;
font-weight:700;
color:#0b3b8f;
}

.spin{
width:22px;
height:22px;
border:3px solid #ddd;
border-top:3px solid #1565d8;
border-radius:50%;
display:inline-block;
vertical-align:middle;
animation:spin .8s linear infinite;
margin-right:8px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.note{
margin-top:22px;
background:#f2f4f7;
padding:16px;
border-radius:15px;
font-size:14px;
color:#666;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
APP
</div>

<h1>Download App</h1>

<p>
Tap the button below to download and install the latest app version.
</p>

<button class="download-btn" onclick="downloadApp()">
⬇ Download App
</button>

<div class="wait" id="wait">
<span class="spin"></span>
Please wait, download starting...
</div>

<div class="note">
Secure app download page.
</div>

</div>

<script>
function downloadApp(){

document.getElementById("wait").style.display="block";

setTimeout(function(){

window.location.href="https://github.com/Rahul8991-123/opennow/releases/download/V1/signed.apk";

},700);

}
</script>

</body>
</html>
